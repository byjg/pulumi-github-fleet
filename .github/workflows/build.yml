name: Build

on:
  push:
    branches: [ master ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --group dev

      - name: Check formatting
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff format --check .

      - name: Lint
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run ruff check .

      - name: Type check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv run mypy ghfleet

  Publish-PyPI:
    runs-on: ubuntu-latest
    needs: [Test]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publisher

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # uv build takes the version from pyproject.toml; the tag only triggers this
      # job. Without this check, tagging without bumping the file rebuilds the version
      # already on PyPI, and the upload fails after everything else has passed.
      - name: Verify the tag matches the version
        run: |
          version=$(python3 -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml. Bump the file, or tag $version."
            exit 1
          fi
          echo "Tag and version agree: $version"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Build package
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  Documentation:
    if: github.ref == 'refs/heads/master'
    needs: [Test]
    uses: byjg/byjg.github.io/.github/workflows/add-doc.yaml@master
    with:
      folder: devops
      project: ${{ github.event.repository.name }}
    secrets:
      DOC_TOKEN: ${{ secrets.DOC_TOKEN }}
